name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore SweetHome.csproj

      - name: Build
        run: dotnet build SweetHome.csproj -f net10.0-android -c Release --no-restore

      - name: Publish APK
        run: dotnet publish SweetHome.csproj -f net10.0-android -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: sweethome-android
          path: publish/*.apk
          if-no-files-found: warn

  build-ios-maccatalyst:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore SweetHome.csproj

      - name: Build Mac Catalyst
        run: dotnet build SweetHome.csproj -f net10.0-maccatalyst -c Release --no-restore
